<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Cinema a Milano — Beltrade · Anteo Palazzo · Colosseo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<style>
  :root{
    --bg:#0c1015; --bg2:#12171e; --card:#161c24; --card2:#1c232d;
    --line:#242c38; --line2:#334050;
    --text:#e8ecf1; --muted:#9daab8; --faint:#8492a1;
    --acc:#6fb8e6; --acc2:#a3d6f4;
    --velvet:#a83a32; --velvet2:#c2493f;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:15px/1.5 Arial,Helvetica,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--acc2);text-decoration:none}
  a:hover{text-decoration:underline}
  code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:var(--bg2);padding:1px 5px;border-radius:4px}

  /* accessibilità */
  :focus-visible{outline:2px solid var(--acc2);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    html{scroll-behavior:auto}
  }

  /* ---------- topbar ---------- */
  .topbar{
    display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
    padding:12px 22px;
    background:radial-gradient(900px 320px at 32% -90px,#16222e,var(--bg));
    border-bottom:1px solid var(--line);
  }
  .tb-left{display:flex;align-items:center;gap:12px}
  .ttl{
    font-size:23px;font-weight:700;line-height:1.05;letter-spacing:.02em;
    color:var(--acc2)
  }
  .sub{font-size:11.5px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;margin-top:4px}
  .tb-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .upd{                                  /* badge biglietto, niente rotazioni */
    display:inline-block;font-size:12.5px;color:var(--muted);
    padding:5px 12px 5px 17px;
    border:1px solid var(--line2);border-left:1px dashed var(--line2);
    border-radius:6px;background:var(--bg2);
    white-space:nowrap
  }
  .upd b{color:var(--text);font-weight:600}
  .upd.stale{color:#ecc069;border-color:#8a6d2a;background:rgba(217,166,72,.1)}
  .rbtn{
    font-size:17px;line-height:1;border:1px solid var(--line2);border-radius:10px;background:var(--bg2);
    color:var(--text);padding:7px 11px;cursor:pointer;transition:.15s;font-family:inherit
  }
  .rbtn:hover{border-color:var(--acc);color:var(--acc2)}
  .rbtn:disabled{opacity:.5;cursor:wait}
  @keyframes spin{to{transform:rotate(360deg)}}
  .rbtn.spin span{display:inline-block;animation:spin .9s linear infinite}
  .staleline{
    display:none;font-size:12.5px;color:#ecc069;background:rgba(217,166,72,.08);
    border-bottom:1px solid rgba(217,166,72,.25);padding:6px 22px
  }
  .filmstrip{
    height:9px;
    background:repeating-linear-gradient(90deg,rgba(111,184,230,.16) 0 8px,transparent 8px 23px),#141a22;
    border-top:1px solid #000;border-bottom:1px solid #000;
  }

  /* ---------- toolbar ---------- */
  .toolbar{
    position:sticky;top:0;z-index:50;background:rgba(10,14,19,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:9px 22px 8px
  }
  .tb-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:1180px;margin:0 auto}
  .vo-toggle{
    display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;
    border:1px solid var(--line2);border-radius:999px;padding:4px 11px;user-select:none
  }
  .vo-toggle input{accent-color:var(--acc);margin:0}
  .vo-toggle.on{color:var(--acc2);border-color:#2c5c7c;background:rgba(111,184,230,.12)}
  .search{
    margin-left:auto;display:flex;align-items:center;gap:7px;
    border:1px solid var(--line2);border-radius:999px;padding:5px 12px;background:var(--card)
  }
  .search input{background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:13.5px;width:160px}
  .search input::placeholder{color:var(--faint)}
  .legendline{max-width:1180px;margin:7px auto 0;font-size:11.5px;color:var(--faint)}

  main{max-width:1180px;margin:0 auto;padding:18px 22px 26px}

  /* ---------- V.O. pill ---------- */
  .vo{
    display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;
    color:#7fd6b4;border:1px solid #2c6e54;background:rgba(67,181,138,.13);
    border-radius:5px;padding:1.5px 6px;vertical-align:2px;cursor:help;white-space:nowrap
  }
  .slotlab{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
  .slotlab.it{color:var(--faint);font-weight:500}

  /* ---------- cinema sections ---------- */
  .cine{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:12px;overflow:hidden}
  .cine-head{
    display:flex;justify-content:space-between;align-items:center;gap:14px;width:100%;
    padding:14px 18px;background:none;border:0;color:var(--text);cursor:pointer;
    font-family:inherit;text-align:left;transition:.15s
  }
  .cine-head:hover{background:var(--card2)}
  .ch-eyebrow{
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:3px
  }
  .ch-name{font-size:19px;font-weight:700;line-height:1.15}
  .ch-info{font-size:12.5px;color:var(--muted);margin-top:4px}
  .ch-side{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .ch-count{font-size:12px;color:var(--faint);white-space:nowrap}
  .chev{
    display:inline-block;color:var(--faint);transition:transform .18s;font-size:13px;width:18px;text-align:center
  }
  .cine.open .cine-head .chev, .xrow.open .xr-head .chev{transform:rotate(90deg);color:var(--acc)}
  .cine-body{display:none;border-top:1px dashed var(--line)}
  .cine.open .cine-body{display:block}
  .cine-links{
    display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 18px;font-size:12.5px;color:var(--muted);
    border-bottom:1px solid var(--line);background:var(--bg2)
  }
  .cine-links span{display:inline-flex;gap:6px;align-items:center}
  .cine-links a{color:var(--muted)}
  .cine-links a:hover{color:var(--acc2)}
  .cine-note{padding:8px 18px;font-size:12px;color:var(--faint);border-bottom:1px dashed var(--line)}
  .emptynote{display:none;padding:14px 18px;font-size:13px;color:var(--faint)}

  /* ---------- card grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:13px;padding:14px 18px}
  .fc{
    background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;
    display:flex;flex-direction:column;gap:8px;transition:.15s
  }
  .fc:hover{border-color:var(--line2);transform:translateY(-1px)}
  .fc.hide{display:none}
  .fc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .fc-poster{flex:0 0 54px;width:54px;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--line2);background:var(--bg)}
  .posterwrap{position:relative;flex:0 0 54px;width:54px;height:80px}
  .posterwrap .fc-poster{position:absolute;inset:0}
  .fc-poster.ph{                                 /* locandina assente: fotogramma di pellicola */
    position:relative;display:flex;align-items:center;justify-content:center;
    border-radius:6px;
    background:
      repeating-linear-gradient(180deg,transparent 0 5px,#222b36 5px 10px) left/7px 100% no-repeat,
      repeating-linear-gradient(180deg,transparent 0 5px,#222b36 5px 10px) right/7px 100% no-repeat,
      linear-gradient(180deg,#141a22,#0e1319);
    font-family:Arial,Helvetica,sans-serif;font-size:18px;color:#5f7d99;letter-spacing:.02em
  }
  .ft{font-size:17.5px;font-weight:700;line-height:1.25;font-family:inherit;margin:0}
  .ft a{color:var(--text)}
  .ft a:hover{color:var(--acc2)}
  .f-orig{font-size:11.5px;color:var(--faint);font-style:italic;margin-top:2px}
  .fm{font-size:12px;color:var(--muted);line-height:1.6}
  .fm b{color:var(--text);font-weight:600}
  .age{
    display:inline-block;font-size:10px;font-weight:700;color:var(--muted);border:1px solid var(--line2);
    border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:middle
  }
  .fd-plot{font-size:11.5px;color:var(--faint);font-style:italic;line-height:1.5}
  .sched{margin-top:auto;display:flex;flex-direction:column;gap:8px}
  .slot{display:flex;flex-direction:column;gap:2px}
  .srow{
    display:flex;gap:12px;align-items:baseline;padding:4px 0;border-top:1px dashed var(--line);flex-wrap:wrap
  }
  .srow .dl{
    min-width:92px;font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.04em;
    display:inline-flex;gap:6px;align-items:baseline
  }
  .srow .venue-tag{font-weight:400;color:var(--faint)}
  .srow.today .dl{color:var(--acc2)}
  .oggi{background:var(--velvet);color:#f6ede4;border-radius:4px;padding:0 4px;font-size:9.5px;font-weight:800;letter-spacing:.04em}
  .ts{display:flex;flex-wrap:wrap;gap:5px}
  .t{
    font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12.5px;background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:2px 8px;
    color:var(--text);cursor:default
  }
  a.t:hover{border-color:var(--acc);color:var(--acc2);text-decoration:none}
  .srow.today .t{border-color:#2c5c7c;background:rgba(111,184,230,.10);color:var(--acc2)}
  .t.tbd{border-style:dashed;color:var(--faint);font-family:inherit;font-size:11.5px}
  .flink{display:inline-block;font-size:11.5px;color:var(--faint);margin-top:4px}
  .flink:hover{color:var(--acc2)}

  /* extras (eventi / prossimamente / prevendita) */
  .xrow{border-top:1px dashed var(--line)}
  .xr-head{
    display:flex;align-items:center;gap:8px;padding:9px 18px;cursor:pointer;font-size:12.5px;
    color:var(--muted);font-weight:600;transition:.12s
  }
  .xr-head:hover{background:var(--card2);color:var(--acc2)}
  .xr-body{display:none;padding:2px 18px 14px}
  .xrow.open .xr-body{display:block}
  .ev{
    border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:8px;background:var(--bg2);
    padding:8px 12px;font-size:12.5px;line-height:1.5;margin-bottom:6px
  }
  .ev b{color:var(--text)}
  .ev .when{color:var(--acc2);font-size:11.5px;font-weight:700}

  @media (max-width:640px){
    .search{margin-left:0}
    .search input{width:130px}
    .cine-head{padding:12px 14px}
    .grid{padding:12px 14px;grid-template-columns:1fr}
    .xr-body{padding:2px 14px 12px}
  }
</style>
</head>

</div>

const EYEBROWS = {
  beltrade: 'cinema d\u2019essai \u00b7 repertorio \u00b7 quasi tutto in v.o.',
  anteo: 'nove sale \u00b7 piazza xxv aprile \u00b7 dal 1990',
  colosseo: 'prima visione \u00b7 anche in v.o. inglese'
};

/* ============================== stato ============================== */
const state = {vo: false, q: ''};
let CURRENT = null;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const isVO = lang => lang.cat === 'vo' || lang.cat === 'eng';
const dayInfo = k => (CURRENT.days || []).find(d => d.key === k);

/* ============================== helper ============================== */
function slotDays(slot){
  const days = Object.keys(slot.shows || {}).filter(k => (slot.shows[k]||[]).length);
  return days.concat(slot.tbd || []);
}
function voTooltip(film){
  const labels = [];
  for (const s of film.slots || []) if (isVO(s.lang)){
    const l = s.lang.audio + (s.lang.sub ? ' · ' + s.lang.sub : '');
    if (!labels.includes(l)) labels.push(l);
  }
  return labels.join(' / ');
}
function chipsHTML(items){
  const chips = items.map(it => {
    if (typeof it === 'string') return '<span class="t">' + esc(it) + '</span>';
    const hall = it.hall ? ' title="Sala ' + esc(it.hall) + '"' : '';
    return it.link
      ? '<a class="t" href="' + esc(it.link) + '" target="_blank" rel="noopener"' + hall + '>' + esc(it.t) + ' 🎟</a>'
      : '<span class="t"' + hall + '>' + esc(it.t) + '</span>';
  });
  return '<span class="ts">' + chips.join('') + '</span>';
}

/* ============================== card ============================== */
function slotHTML(slot){
  let html = '<div class="slot">';
  html += '<span class="slotlab' + (isVO(slot.lang) ? '' : ' it') + '" title="' +
    esc(slot.lang.audio + (slot.lang.sub ? ' · ' + slot.lang.sub : '')) + '">' +
    (isVO(slot.lang) ? '<span class="vo">V.O.</span> ' : '') +
    (slot.lang.cat === 'none' ? 'senza dialoghi' :
     slot.lang.cat === 'voita' ? 'in italiano · sott. ing' :
     slot.lang.cat === 'ita' ? 'in italiano' : '') +
    (slot.venue ? ' · ' + esc(slot.venue) : '') + '</span>';
  for (const d of (CURRENT.days || []).map(x => x.key)){
    const items = (slot.shows || {})[d] || [];
    if (!items.length) continue;
    const di = dayInfo(d);
    const label = di.short + (slot.anteprima ? ' · ANTEPRIMA' : '');
    html += '<div class="srow' + (di.today ? ' today' : '') + '" data-day="' + d + '">' +
      '<span class="dl">' + (di.today ? '<span class="oggi">OGGI</span>' : '') + label + '</span>' +
      chipsHTML(items) + '</div>';
  }
  for (const d of slot.tbd || []){
    const di = dayInfo(d);
    html += '<div class="srow" data-day="' + d + '"><span class="dl">' + esc(di ? di.short : d) +
      '</span><span class="ts"><span class="t tbd">orario da definire</span></span></div>';
  }
  html += '</div>';
  return html;
}

function filmCardHTML(cinema, film){
  const vo = (film.slots || []).some(s => isVO(s.lang));
  const tip = vo ? ' title="' + esc(voTooltip(film)) + '"' : '';
  let meta = [];
  if (film.dir) meta.push('di <b>' + esc(film.dir) + '</b>');
  if (film.cast) meta.push(esc(film.cast));
  if (film.meta) meta.push(esc(film.meta));
  if (film.genre) meta.push(esc(film.genre));
  const initial = esc((film.title || '★')[0]);
  const ph = '<div class="fc-poster ph" aria-hidden="true">' + initial + '</div>';
  const poster = film.poster
    ? '<div class="posterwrap">' + ph + '<img class="fc-poster" loading="lazy" src="' + esc(film.poster) + '" alt="" onerror="this.remove()"></div>'
    : ph;
  return '<article class="fc" id="film-' + cinema.id + '-' + film.id + '"' +
      ' data-vo="' + (vo ? 1 : 0) + '"' +
      ' data-q="' + esc(norm([film.title, film.orig, film.dir, film.cast].filter(Boolean).join(' '))) + '">' +
    '<div class="fc-top">' + poster +
      '<div style="flex:1"><h3 class="ft"><a href="' + film.url + '" target="_blank" rel="noopener">' + esc(film.title) + '</a></h3>' +
      (film.orig ? '<div class="f-orig">' + esc(film.orig) + '</div>' : '') + '</div>' +
      (vo ? '<span class="vo"' + tip + '>V.O.</span>' : '') + '</div>' +
    '<div class="fm">' + meta.join(' · ') +
      (film.age ? '<span class="age">' + esc(film.age) + '</span>' : '') + '</div>' +
    (film.plot ? '<div class="fd-plot">' + esc(film.plot) + '</div>' : '') +
    '<div class="sched">' + (film.slots || []).map(slotHTML).join('') + '</div>' +
    '<a class="flink" href="' + film.url + '" target="_blank" rel="noopener">scheda film e biglietti ↗</a>' +
  '</article>';
}

/* ============================== sezioni cinema ============================== */
function cinemaHTML(cinema){
  const films = cinema.films || [];
  let nShows = 0, nVO = 0;
  for (const f of films){
    let vo = false;
    for (const s of f.slots || []){
      nShows += Object.values(s.shows || {}).reduce((a, t) => a + t.length, 0);
      if (isVO(s.lang)) vo = true;
    }
    if (vo) nVO++;
  }
  const links = ['<a href="' + cinema.site + '" target="_blank" rel="noopener">sito ↗</a>'];
  const extras = cinema.extra || [];
  const extraHTML = extras.length
    ? '<div class="xrow"><div class="xr-head"><span class="chev">▸</span> 📅 ' +
      esc(extras[0].h) + ' (' + extras.reduce((a, x) => a + x.items.length, 0) + ')</div>' +
      '<div class="xr-body">' + extras.map(x => x.items.map(i => '<div class="ev">' + i + '</div>').join('')).join('') + '</div></div>'
    : '';
  return '<section class="cine" id="cinema-' + cinema.id + '">' +
    '<button class="cine-head" aria-expanded="false">' +
      '<div><div class="ch-eyebrow">' + esc(EYEBROWS[cinema.id] || '') + '</div>' +
      '<div class="ch-name">' + esc(cinema.name) + '</div>' +
      '<div class="ch-info">' + esc(cinema.address || cinema.tagline) + '</div></div>' +
      '<div class="ch-side"><span class="ch-count">' + films.length + ' film · ' + nShows + ' spett.' +
        (nVO ? ' · ' + nVO + ' in v.o.' : '') + '</span><span class="chev">▸</span></div>' +
    '</button>' +
    '<div class="cine-body">' +
      '<div class="cine-links">' + links.join('') + '</div>' +
      (cinema.cineNote ? '<div class="cine-note">' + esc(cinema.cineNote) + '</div>' : '') +
      (films.length
        ? '<div class="grid">' + films.map(f => filmCardHTML(cinema, f)).join('') + '</div>'
        : '<div class="emptynote" style="display:block">Nessun film pubblicato per questa settimana.</div>') +
      '<div class="emptynote filternote">Nessun film corrisponde ai filtri (giorno / V.O. / ricerca).</div>' +
      extraHTML +
    '</div>' +
  '</section>';
}

/* ============================== render + filtri ============================== */
function renderAll(data){
  CURRENT = data;
  const main = $('#cinemas');
  main.innerHTML = (data.cinemas || []).map(cinemaHTML).join('');

  main.addEventListener('click', e => {
    const head = e.target.closest('.cine-head');
    if (head){
      const sec = head.parentElement;
      const open = sec.classList.toggle('open');
      head.setAttribute('aria-expanded', open);
      return;
    }
    const xr = e.target.closest('.xr-head');
    if (xr){ xr.parentElement.classList.toggle('open'); }
  });

  updateUpdBadge();
  applyFilters();
}

function applyFilters(){
  document.querySelectorAll('.fc').forEach(r => {
    const voOK = !state.vo || r.dataset.vo === '1';
    const qOK = !state.q || (r.dataset.q || '').includes(state.q);
    r.classList.toggle('hide', !(voOK && qOK));
  });
  document.querySelectorAll('.cine').forEach(sec => {
    const visible = sec.querySelectorAll('.fc:not(.hide)').length;
    const hasFilms = sec.querySelectorAll('.fc').length > 0;
    const empty = sec.querySelector('.filternote');
    if (empty) empty.style.display = (hasFilms && !visible) ? 'block' : 'none';
  });
}

function updateUpdBadge(){
  const badge = $('#upd-badge');
  const real = new Date();
  const realToday = real.getFullYear() + '-' + String(real.getMonth()+1).padStart(2,'0') + '-' + String(real.getDate()).padStart(2,'0');
  const stale = realToday > CURRENT.today;
  badge.classList.toggle('stale', stale);
  badge.innerHTML = (stale ? '⚠️ ' : '') + 'dati: <b>' + esc(CURRENT.updated) + '</b>';
  const sl = $('#staleline');
  if (stale){
    sl.style.display = 'block';
    sl.innerHTML = '⚠️ I dati sono del <b>' + esc(CURRENT.updatedLong) + '</b> — per gli orari di oggi apri il Terminale e lancia <code>python3 ~/cinema-milano/update.py</code>, poi premi ⟳';
  } else {
    sl.style.display = 'none';
  }
}

/* ============================== caricamento dati / refresh ============================== */
function loadData(fresh){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'cinema-data.js' + (fresh ? '?r=' + Date.now() : '');
    s.onload = () => resolve(window.DATA || null);
    s.onerror = () => reject(new Error('cinema-data.js non caricabile'));
    document.head.appendChild(s);
  });
}

function refresh(fresh){
  const btn = $('#refresh-btn');
  btn.disabled = true;
  btn.classList.add('spin');
  loadData(fresh)
    .then(d => {
      if (d && (!CURRENT || d.updated !== CURRENT.updated)){
        renderAll(d);            // dati nuovi → ridisegna
      } else if (d){
        updateUpdBadge();        // stessi dati → solo badge
      } else {
        throw new Error('no data');
      }
    })
    .catch(() => {
      if (!CURRENT && EMBEDDED){
        renderAll(EMBEDDED);     // prima apertura senza cinema-data.js
      }
    })
    .finally(() => { btn.disabled = false; btn.classList.remove('spin'); });
}

/* ============================== boot ============================== */
$('#cines-sub').textContent = ['Beltrade', 'Anteo Palazzo del Cinema', 'Colosseo'].join(' · ');
$('#refresh-btn').addEventListener('click', () => refresh(true));
$('#vo-only').addEventListener('change', e => {
  state.vo = e.target.checked;
  $('#vo-toggle').classList.toggle('on', state.vo);
  applyFilters();
});
$('#q').addEventListener('input', e => { state.q = norm(e.target.value.trim()); applyFilters(); });

/* tornando sulla pagina: ricarica in silenzio i dati (senza richiudere le
   sezioni aperte, a meno che i dati siano cambiati) */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && CURRENT) refresh(true);
});

refresh(false);
</script>
